name: Sync Dicts from rime-wanxiang-data

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          repository: amzxyz/rime-wanxiang-data
          ref: wanxiang
          path: source
          fetch-depth: 1

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: amzxyz/rime-wanxiang
          ref: wanxiang
          path: target
          fetch-depth: 1

      - name: Copy specified dict files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p target/dicts

          for f in cuoyin daolu diming duoyin jichu \
                   mingren renming shiti yiren zi; do
            cp "source/dicts/${f}.dict.yaml" \
               "target/dicts/${f}.dict.yaml"
          done

      - name: Commit and push to target repo
        shell: bash
        run: |
          set -euo pipefail

          cd target

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dicts/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "dict: 词库调整"
            git push origin wanxiang
          fi